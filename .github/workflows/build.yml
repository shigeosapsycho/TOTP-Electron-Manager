name: Build TOTP Manager

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed for release upload

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            ebuilder_args: --mac dmg zip
            artifact_glob: |
              frontend/dist-final/*.dmg
              frontend/dist-final/*.zip
          - os: windows-latest
            platform: win
            ebuilder_args: --win nsis
            artifact_glob: |
              frontend/dist-final/*.exe
          - os: ubuntu-latest
            platform: linux
            ebuilder_args: --linux AppImage
            artifact_glob: |
              frontend/dist-final/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        run: npm run build

      - name: Build Electron (${{ matrix.platform }})
        working-directory: frontend
        env:
          # Disable code signing - no Apple/Microsoft certs
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # GH_TOKEN only needed if electron-builder publishes directly
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.ebuilder_args }} --publish never

      - name: List build output
        working-directory: frontend
        shell: bash
        run: ls -la dist-final/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: totp-manager-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/totp-manager-mac/*
            artifacts/totp-manager-win/*
            artifacts/totp-manager-linux/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
